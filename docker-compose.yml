version: '3.8'

services:
  langflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - ./flows:/app/flows
      - ./database:/app/database
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - LANGFLOW_PORT=7860
      - OPENAI_API_KEY=
    command: ["langflow", "--log-level", "info", "--host", "0.0.0.0", "--port", "7860"]
    depends_on:
      - tesseract_ocr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  tesseract_ocr:
    image: arm64v8/tesseract-ocr:latest
    command: ["tail", "-f", "/dev/null"]
